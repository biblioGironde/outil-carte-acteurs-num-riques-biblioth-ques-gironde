name: Vérification annuelle des acteurs

# Tourne le 2 de chaque mois : les mois ordinaires, il se contente de rester actif
# (GitHub désactive les tâches planifiées des dépôts publics après 60 jours sans activité) ;
# le mois défini par MOIS_VERIFICATION, il vérifie chaque acteur, ouvre une issue de rapport
# et propose les dates de vérification par pull request (la branche main est protégée).
# Lancement manuel possible : onglet Actions → ce workflow → « Run workflow ».

on:
  schedule:
    - cron: '23 5 2 * *'
  workflow_dispatch:

env:
  MOIS_VERIFICATION: '01' # janvier

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Maintenir la tâche planifiée active
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/verification-annuelle.yml/enable" || true

      - name: Est-ce le mois de la vérification ?
        id: calendrier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%m)" = "$MOIS_VERIFICATION" ]; then
            echo "lancer=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Pas ce mois-ci."
          fi

      - uses: actions/checkout@v4
        if: steps.calendrier.outputs.lancer == 'oui'

      - uses: actions/setup-node@v4
        if: steps.calendrier.outputs.lancer == 'oui'
        with:
          node-version: 22

      - name: Vérifier les acteurs
        if: steps.calendrier.outputs.lancer == 'oui'
        run: node scripts/verifier.mjs --rapport rapport-verification.md

      - name: Publier le rapport
        id: rapport
        if: steps.calendrier.outputs.lancer == 'oui'
        run: |
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Vérification annuelle $(date -u +%Y)" --body-file rapport-verification.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Proposer les dates de vérification
        if: steps.calendrier.outputs.lancer == 'oui'
        env:
          ISSUE: ${{ steps.rapport.outputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/acteurs.geojson
          if git diff --cached --quiet; then echo "Aucune donnée à enregistrer."; exit 0; fi
          annee=$(date -u +%Y)
          branche="verification/${annee}-${GITHUB_RUN_ID}"
          git switch -c "$branche"
          git commit -m "Vérification annuelle ${annee} : dates de contrôle"
          git push origin "$branche"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branche" \
            --base "${{ github.event.repository.default_branch }}" \
            --title "Vérification annuelle ${annee} : dates de contrôle" \
            --body "Met à jour la date de dernière vérification de chaque acteur. Rapport et acteurs à traiter : ${ISSUE}"
