name: Import CSV → proposition de modification

# Un fichier .csv déposé dans import/ est lu, chaque ligne contrôlée et géolocalisée.
# - Dépôt sur une branche (cas normal, main étant protégée) : le résultat est ajouté à cette
#   même branche et une pull request est ouverte (ou complétée) avec le rapport d'import.
# - Dépôt directement sur main (administrateur) : une nouvelle branche et une pull request sont créées.

on:
  push:
    branches-ignore:
      - 'import/**'
      - 'formulaire/**'
      - 'verification/**'
    paths:
      - 'import/*.csv'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-csv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAUT: ${{ github.event.repository.default_branch }}
      AUTEUR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Fichiers à importer
        id: fichiers
        run: |
          shopt -s nullglob
          fichiers=(import/*.csv)
          echo "nb=${#fichiers[@]}" >> "$GITHUB_OUTPUT"
          [ ${#fichiers[@]} -eq 0 ] && echo "Aucun fichier à importer." || true

      - uses: actions/setup-node@v4
        if: steps.fichiers.outputs.nb != '0'
        with:
          node-version: 22

      - name: Importer
        if: steps.fichiers.outputs.nb != '0'
        run: |
          : > rapport-import.md
          for f in import/*.csv; do
            node scripts/importer-csv.mjs "$f" --rapport rapport-import.md
            echo "" >> rapport-import.md
            git rm -q "$f"
          done
          node scripts/valider.mjs
          { echo "Fichier déposé par @$AUTEUR."; echo; cat rapport-import.md; } > corps.md

      - name: Enregistrer et proposer
        if: steps.fichiers.outputs.nb != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/acteurs.geojson
          if [ "$GITHUB_REF_NAME" = "$DEFAUT" ]; then
            branche="import/${GITHUB_RUN_ID}"
            git switch -c "$branche"
          else
            branche="$GITHUB_REF_NAME"
          fi
          git commit -m "Import CSV déposé par $AUTEUR"
          git push origin "HEAD:$branche"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branche" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branche" --base "$DEFAUT" \
              --title "Import CSV déposé par $AUTEUR" --body-file corps.md
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file corps.md
          fi
