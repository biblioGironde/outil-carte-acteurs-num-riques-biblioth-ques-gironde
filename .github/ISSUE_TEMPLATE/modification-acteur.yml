# Fichier généré par scripts/generer-formulaires.mjs — ne pas modifier à la main.
name: "Modifier ou retirer un acteur"
description: "Corriger une fiche existante ou retirer une structure de la carte (réservé aux collaborateurs du dépôt)."
title: "[Modification] "
body:
  - type: markdown
    attributes:
      value: "Ne remplissez que les champs qui changent : les champs laissés vides restent inchangés. Pour les cases à cocher, cochez la liste complète souhaitée (elle remplace l’ancienne)."
  - type: input
    id: identifiant
    attributes:
      label: "Identifiant de l'acteur"
      description: "Affiché en bas de la fiche de l’acteur sur la carte (ex. : fablab-du-coin-merignac). Le lien « Proposer une modification » de la fiche le remplit automatiquement."
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: "Type de demande"
      options:
        - "Modifier les informations"
        - "Retirer de la carte (structure fermée ou hors périmètre)"
    validations:
      required: true
  - type: textarea
    id: motif
    attributes:
      label: "Motif ou précisions"
      description: "Obligatoire pour un retrait. Pour une modification, ne remplissez ci-dessous que les champs qui changent ; écrivez « - » pour vider un champ facultatif."
    validations:
      required: false
  - type: input
    id: nom
    attributes:
      label: "Nom de la structure"
    validations:
      required: false
  - type: checkboxes
    id: etiquettes
    attributes:
      label: "Étiquettes"
      description: "Cochez une ou plusieurs étiquettes."
      options:
        - label: "Inclusion et médiation numérique"
        - label: "Fabrication numérique (fablabs, tiers-lieux)"
        - label: "Éducation aux médias et à l'information"
        - label: "Promeneurs du Net"
        - label: "Éducation populaire"
        - label: "Musique"
        - label: "Micro-Folie (musée numérique)"
        - label: "Institutionnel"
  - type: dropdown
    id: domaine_musique
    attributes:
      label: "Domaine musical (étiquette Musique uniquement)"
      options:
        - "Musiques actuelles"
        - "Musiques classiques et de répertoire"
        - "Musiques traditionnelles et du monde"
        - "Jazz et musiques improvisées"
        - "Tous styles"
    validations:
      required: false
  - type: checkboxes
    id: activites_musique
    attributes:
      label: "Activités musicales (étiquette Musique uniquement)"
      description: "Cochez toutes les activités de la structure."
      options:
        - label: "Salle de concert, lieu de diffusion"
        - label: "Festival"
        - label: "Producteur de spectacles, tourneur"
        - label: "Label, production phonographique"
        - label: "Édition musicale"
        - label: "Studio d'enregistrement"
        - label: "Lieu de répétition"
        - label: "Accompagnement d'artistes"
        - label: "Enseignement, école de musique"
        - label: "Action culturelle, médiation"
        - label: "Radio, média"
        - label: "Réseau, fédération, centre de ressources"
        - label: "Disquaire, commerce culturel"
  - type: textarea
    id: description
    attributes:
      label: "Description courte"
      description: "2 ou 3 phrases : ce que fait la structure, pour qui. 500 caractères maximum."
    validations:
      required: false
  - type: input
    id: adresse
    attributes:
      label: "Adresse (numéro et rue)"
    validations:
      required: false
  - type: input
    id: code_postal
    attributes:
      label: "Code postal"
      placeholder: "33000"
    validations:
      required: false
  - type: input
    id: commune
    attributes:
      label: "Commune"
    validations:
      required: false
  - type: input
    id: coordonnees
    attributes:
      label: "Coordonnées GPS (facultatif)"
      description: "Format « latitude, longitude » (ex. 44.8378, -0.5792). Laissez vide : l’adresse sera géolocalisée automatiquement."
    validations:
      required: false
  - type: input
    id: site
    attributes:
      label: "Site web"
      placeholder: "https://"
    validations:
      required: false
  - type: input
    id: email
    attributes:
      label: "Courriel de contact de la structure"
      description: "Adresse générique uniquement (contact@…, accueil@…), jamais une adresse nominative."
    validations:
      required: false
  - type: input
    id: telephone
    attributes:
      label: "Téléphone de la structure"
    validations:
      required: false
  - type: input
    id: reseaux
    attributes:
      label: "Réseau(x) d'appartenance"
      description: "Séparés par des virgules (ex. : Hubikoop, Promeneurs du Net Gironde)."
    validations:
      required: false
  - type: checkboxes
    id: public
    attributes:
      label: "Publics"
      options:
        - label: "Jeunesse"
        - label: "Familles"
        - label: "Tout public"
        - label: "Seniors"
        - label: "Professionnels"
  - type: input
    id: siret
    attributes:
      label: "SIRET"
      description: "14 chiffres. Fortement conseillé : il sert à la vérification annuelle automatique."
    validations:
      required: false
  - type: input
    id: rna
    attributes:
      label: "Numéro RNA"
      description: "W suivi de 9 chiffres (ex. W332012345)."
    validations:
      required: false
